<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0b14" />
    <meta
      name="description"
      content="MAFIA Recruitments - University club recruitment management system for MAFIA at NMIMS. Track candidates, interviews, and payments in real-time."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/mafia-logo.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <!-- Google Fonts: Bakbak One (display), Inter (UI), JetBrains Mono (truth channel) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bakbak+One&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

    <!--
      Legacy vars kept ONLY because they are defined nowhere else (Phase 1 verification:
      every other var in the old inline block is redefined in src/theme/styles.css or
      src/styles/globals.css; these seven are not — see redesign Phase 1 report).
      They currently have zero consumers in src/ and die with the old sheets in Phase 4.
    -->
    <style>
      :root {
        --color-primary-soft: rgba(204, 0, 204, 0.12);
        --color-primary-border: rgba(204, 0, 204, 0.32);
        --color-surface-border-soft: rgba(255, 255, 255, 0.06);
        --color-text-mute: rgba(245, 245, 250, 0.42);
        --font-wordmark: "Space Grotesk", "Outfit", "Inter", sans-serif;
        --font-mono: "JetBrains Mono", "SF Mono", ui-monospace, monospace;
        --shadow-glow: 0 0 20px rgba(204, 0, 204, 0.3);
      }
    </style>

    <title>MAFIA Recruitments</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
